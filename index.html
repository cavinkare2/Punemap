
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta
    name="theme-color"
    content="#ffffff"
>

<title>
FMCG Location Network
</title>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/* ==========================================================
   RESET
   ========================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    background: #fff;

    color: #111827;
}


button,
select,
input {

    font-family: inherit;
}


/* ==========================================================
   APP
   ========================================================== */

#app {

    width: 100%;
    height: 100%;

    position: relative;

    display: flex;
}


/* ==========================================================
   MAP
   ========================================================== */

#map {

    flex: 1;

    width: 100%;
    height: 100%;

    min-width: 0;
}


/* ==========================================================
   DESKTOP SIDEBAR
   ========================================================== */

#sidebar {

    width: 340px;
    min-width: 340px;

    height: 100%;

    overflow-y: auto;

    background: white;

    border-right:
        1px solid #d0d5dd;

    padding: 16px;

    z-index: 1000;

    order: -1;
}


.header-title {

    font-size: 20px;

    font-weight: 800;

    margin-bottom: 4px;
}


.header-subtitle {

    font-size: 12px;

    line-height: 1.5;

    color: #667085;
}


/* ==========================================================
   SECTION
   ========================================================== */

.section {

    border-top:
        1px solid #e4e7ec;

    padding-top: 14px;

    margin-top: 14px;
}


.section-title {

    font-size: 11px;

    font-weight: 800;

    color: #475467;

    text-transform: uppercase;

    letter-spacing: .06em;

    margin-bottom: 10px;
}


/* ==========================================================
   KPI
   ========================================================== */

.kpi-grid {

    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 8px;

    margin-top: 14px;
}


.kpi {

    background: #f5f6f8;

    border-radius: 8px;

    padding: 9px;
}


.kpi-number {

    font-size: 18px;

    font-weight: 800;
}


.kpi-label {

    margin-top: 2px;

    font-size: 10px;

    color: #667085;
}


/* ==========================================================
   CONTROLS
   ========================================================== */

select {

    width: 100%;

    min-height: 44px;

    padding: 0 10px;

    border:
        1px solid #d0d5dd;

    border-radius: 8px;

    background: white;

    font-size: 16px;
}


.checkbox-row {

    min-height: 42px;

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 14px;
}


.checkbox-row input {

    width: 20px;
    height: 20px;

    flex-shrink: 0;
}


button {

    width: 100%;

    min-height: 46px;

    border: 0;

    border-radius: 9px;

    padding: 10px 12px;

    cursor: pointer;

    font-size: 14px;

    font-weight: 800;
}


.primary-button {

    background: #111827;

    color: white;
}


.secondary-button {

    background: #eef1f5;

    color: #1f2937;

    margin-top: 8px;
}


/* ==========================================================
   MOBILE PANEL BUTTON
   ========================================================== */

#mobileControlsButton {

    display: none;

    position: absolute;

    z-index: 2000;

    left: 12px;

    top: 12px;

    width: auto;

    min-height: 44px;

    padding: 0 15px;

    background: white;

    color: #111827;

    border:
        1px solid #d0d5dd;

    border-radius: 22px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.18);
}


/* ==========================================================
   MOBILE PANEL HEADER
   ========================================================== */

#mobilePanelHeader {

    display: none;

    align-items: center;

    justify-content:
        space-between;

    margin-bottom: 12px;
}


#closePanel {

    width: 44px;

    min-height: 44px;

    background: #f2f4f7;

    font-size: 20px;

    padding: 0;
}


/* ==========================================================
   RESULT
   ========================================================== */

#locationStatus {

    font-size: 12px;

    line-height: 1.45;

    color: #667085;

    margin-top: 10px;
}


#locationResults {

    margin-top: 8px;
}


.nearest-card {

    display: grid;

    grid-template-columns:
        34px 1fr auto;

    gap: 9px;

    align-items: center;

    padding: 10px 8px;

    margin-bottom: 7px;

    border:
        1px solid #e4e7ec;

    background: #f9fafb;

    border-radius: 9px;

    cursor: pointer;
}


.nearest-rank {

    width: 30px;
    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #111827;

    color: white;

    border-radius: 50%;

    font-size: 12px;

    font-weight: 800;
}


.nearest-name {

    font-size: 13px;

    font-weight: 800;

    line-height: 1.3;
}


.nearest-meta {

    margin-top: 2px;

    font-size: 11px;

    line-height: 1.35;

    color: #667085;
}


.nearest-distance {

    font-size: 13px;

    font-weight: 800;

    white-space: nowrap;
}


/* ==========================================================
   POINT MARKER
   ========================================================== */

.location-marker {

    background: transparent !important;

    border: none !important;
}


.location-badge {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 28px;
    height: 28px;

    border-radius: 50%;

    color: white;

    border:
        2px solid white;

    box-shadow:
        0 1px 5px
        rgba(0,0,0,.45);

    font-size: 9px;

    font-weight: 900;
}


/* ==========================================================
   DISTANCE
   ========================================================== */

.distance-marker {

    background: transparent !important;

    border: 0 !important;
}


.distance-label {

    white-space: nowrap;

    transform:
        translate(-50%,-50%);

    padding:
        3px 6px;

    border-radius: 5px;

    background:
        rgba(255,255,255,.96);

    border:
        1px solid
        rgba(17,24,39,.20);

    color: #111827;

    font-size: 10px;

    line-height: 1;

    font-weight: 900;

    box-shadow:
        0 1px 3px
        rgba(0,0,0,.14);
}


/* ==========================================================
   CURRENT LOCATION
   ========================================================== */

.user-location-marker {

    background: transparent !important;

    border: 0 !important;
}


.user-location-dot {

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: #2563eb;

    border:
        4px solid white;

    box-shadow:
        0 0 0 4px
        rgba(37,99,235,.25),
        0 2px 8px
        rgba(0,0,0,.30);
}


.nearest-highlight {

    width: 34px;
    height: 34px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #111827;

    border:
        3px solid white;

    color: white;

    box-shadow:
        0 2px 7px
        rgba(0,0,0,.35);

    font-size: 11px;

    font-weight: 900;
}


/* ==========================================================
   POPUP
   ========================================================== */

.popup-title {

    font-size: 16px;

    font-weight: 800;
}


.popup-subtitle {

    margin-top: 2px;

    margin-bottom: 10px;

    color: #667085;

    font-size: 11px;
}


.popup-table {

    width: 100%;

    border-collapse:
        collapse;

    font-size: 11px;
}


.popup-table td {

    padding: 5px;

    vertical-align: top;

    border-bottom:
        1px solid #eeeeee;
}


.popup-table td:first-child {

    width: 44%;

    font-weight: 700;

    color: #667085;
}


.popup-nearest {

    margin-top: 10px;

    padding: 8px;

    background: #f4f6f8;

    border-radius: 6px;

    line-height: 1.6;

    font-size: 11px;
}


/* ==========================================================
   LEGEND
   ========================================================== */

#legend {

    max-height: 180px;

    overflow-y: auto;
}


.legend-row {

    display: flex;

    align-items: center;

    gap: 7px;

    margin-bottom: 5px;

    font-size: 11px;

    color: #475467;
}


.legend-line {

    width: 20px;

    height: 5px;

    border-radius: 2px;

    flex-shrink: 0;
}


/* ==========================================================
   PHONE
   ========================================================== */

@media
(max-width: 768px) {


    #app {

        display: block;
    }


    #map {

        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;
    }


    #mobileControlsButton {

        display: block;
    }


    #sidebar {

        position: absolute;

        z-index: 3000;

        left: 0;
        right: 0;
        bottom: 0;

        width: 100%;
        min-width: 0;

        height: auto;

        max-height: 82%;

        border-right: 0;

        border-top:
            1px solid #d0d5dd;

        border-radius:
            18px 18px 0 0;

        box-shadow:
            0 -5px 24px
            rgba(0,0,0,.18);

        padding:
            14px 16px 24px;

        transform:
            translateY(105%);

        transition:
            transform .25s ease;

        overflow-y: auto;
    }


    #sidebar.open {

        transform:
            translateY(0);
    }


    #mobilePanelHeader {

        display: flex;
    }


    .header-title {

        font-size: 18px;
    }


    .header-subtitle {

        display: none;
    }


    .section {

        margin-top: 12px;

        padding-top: 12px;
    }


    .leaflet-control-zoom {

        margin-top: 66px !important;
    }


    .leaflet-popup-content {

        margin:
            10px 12px;

        max-height: 55vh;

        overflow-y: auto;
    }


    .leaflet-popup-content-wrapper {

        border-radius: 10px;
    }

}


/* ==========================================================
   SMALL PHONE
   ========================================================== */

@media
(max-width: 420px) {


    #sidebar {

        max-height: 86%;

        padding-left: 12px;
        padding-right: 12px;
    }


    .nearest-card {

        grid-template-columns:
            32px 1fr;

        gap: 7px;
    }


    .nearest-distance {

        grid-column: 2;

        justify-self: start;

        margin-top: -4px;
    }

}

</style>

</head>

<div id="app">


    <!-- MOBILE CONTROLS -->

    <button
        id="mobileControlsButton"
        type="button"
    >
        ☰ Filters
    </button>


    <!-- SIDEBAR -->

    <aside id="sidebar">


        <div id="mobilePanelHeader">

            <strong>
                Map Controls
            </strong>

            <button
                id="closePanel"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="header-title">
            FMCG Location Network
        </div>


        <div class="header-subtitle">

            maximum 50 km ·

        </div>


        <!-- KPI -->

        <div class="kpi-grid">

            <div class="kpi">

                <div

                    -
                </div>

                <div class="kpi-label">
                    Visible locations

            </div>


            <div class="kpi">

                <div

                    id="visibleLines">

                <div class="kpi-label">

            </div>

        </div>


        <!-- FILTERS -->

        <div class="section">

            <div class="section-title">
                Filters
            </div>


            <select

                <option value="ALL">

                </option>

            </select>


            <div class="checkbox-row">

                <label for="showP1">
                    P1
                </label>

            </div>


            <div class="checkbox-row">

                <input
                    type="checkbox"
                    id="showP2"
                    checked
                >

                <label for="showP2">
                    P2
                </label>

            </div>


            <div class="checkbox-row">

                <input
                    type="checkbox"
                    id="showOther"
                    checked
                >

                <label for="showOther">
                    Other / DHQ
                </label>

            </div>


            <div class="checkbox-row">

                <input
                    type="checkbox"
                    id="showDistances"
                    checked
                >

                <label for="showDistances">
                    Distance labels
                </label>

            </div>


            <button
                id="resetFilters"
                type="button"
                class="secondary-button"
            >
                Reset Filters
            </button>

        </div>


        <!-- LOCATION -->

        <div class="section">

            <div class="section-title">
                Nearest from current location
            </div>


            <button
                id="locationButton"
                type="button"
                class="primary-button"
            >
                ◎ Find Nearest 5
            </button>


            <button
                id="clearLocation"
                type="button"
                class="secondary-button"
            >
                Clear Location
            </button>


            <div id="locationStatus">

                Finds the nearest 5 mapped points
                within 50 km of your current location.

            </div>


            <div id="locationResults">
            </div>

        </div>


        <!-- LEGEND -->

        <div class="section">

            <div class="section-title">
                Tehsil colours
            </div>

            <div id="legend">
            </div>

        </div>


    </aside>


    <main id="map">
    </main>


</div>

// ============================================================
// ESCAPE
// ============================================================

function escapeHtml(value) {

    if (
        value === null
        ||
        value === undefined
    ) {

        return "";
    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


// ============================================================
// FORMAT
// ============================================================

function formatValue(
    field,
    value
) {


    if (
        value === null
        ||
        value === undefined
        ||
        value === ""
    ) {

        return "-";
    }


    const lower =
        String(field)
        .toLowerCase();


    if (
        field === "Latitude"
        ||
        field === "Longitude"
    ) {

        const n =
            Number(value);


        return Number.isFinite(n)
            ?
            n.toFixed(6)
            :
            escapeHtml(value);
    }


    if (
        typeof value === "number"
        &&
        (
            lower.includes(
                "population"
            )
            ||
            lower.includes(
                "outlet"
            )
        )
    ) {

        return value.toLocaleString(
            "en-IN"
        );
    }


    return escapeHtml(
        value
    );
}


// ============================================================
// HAVERSINE
// ============================================================

function haversineKm(
    lat1,
    lon1,
    lat2,
    lon2
) {


    const R =
        6371.0088;


    const rad =
        x =>
        x * Math.PI / 180;


    const p1 =
        rad(lat1);


    const p2 =
        rad(lat2);


    const dp =
        rad(
            lat2 - lat1
        );


    const dl =
        rad(
            lon2 - lon1
        );


    const a =
        Math.sin(
            dp / 2
        ) ** 2

        +

        Math.cos(p1)
        *
        Math.cos(p2)
        *
        Math.sin(
            dl / 2
        ) ** 2;


    return (
        R
        *
        2
        *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        )
    );
}

// ============================================================
// POPUP
// ============================================================

function buildPopup(p) {


    let rows = "";


    DISPLAY_FIELDS.forEach(
        field => {


            rows +=
                "<tr>"
                +
                "<td>"
                +
                escapeHtml(field)
                +
                "</td>"
                +
                "<td>"
                +
                formatValue(
                    field,
                    p[field]
                )
                +
                "</td>"
                +
                "</tr>";

        }
    );


    let nearest =
        "<div class='popup-nearest'>";


    if (
        p.nearest1
    ) {


        nearest +=

            "<strong>Nearest 1:</strong> "

            +
            escapeHtml(
                p.nearest1
            )

            +
            " · "

            +
            Number(
                p.nearest1km
            ).toFixed(1)

            +
            " km<br>";
    }


    if (
        p.nearest2
    ) {


        nearest +=

            "<strong>Nearest 2:</strong> "

            +
            escapeHtml(
                p.nearest2
            )

            +
            " · "

            +
            Number(
                p.nearest2km
            ).toFixed(1)

            +
            " km";
    }


    if (
        !p.nearest1
        &&
        !p.nearest2
    ) {

        nearest +=
            "No location within 50 km.";
    }


    nearest +=
        "</div>";


    return (

        "<div style='min-width:250px;max-width:390px;'>"

        +

        "<div class='popup-title'>"
        +
        escapeHtml(
            p.town
        )
        +
        "</div>"

        +

        "<div class='popup-subtitle'>"
        +
        escapeHtml(
            p.tehsil
        )
        +
        " · "
        +
        escapeHtml(
            p.villageType
            ||
            "Other"
        )
        +
        "</div>"

        +

        "<table class='popup-table'>"
        +
        rows
        +
        "</table>"

        +

        nearest

        +

        "</div>"

    );
}


// ============================================================
// POINT ICON
// ============================================================

function pointIcon(p) {


    const colour =
        TEHSIL_COLORS[
            p.tehsil
        ]
        ||
        "#475467";


    let label =
        p.villageType
        ||
        "•";


    if (
        label.length > 4
    ) {

        label =
            label.slice(
                0,
                4
            );
    }


    return L.divIcon({

        className:
            "location-marker",

        html:

            "<div class='location-badge' style='background:"
            +
            colour
            +
            ";'>"
            +
            escapeHtml(
                label
            )
            +
            "</div>",

        iconSize:
            [
                28,
                28
            ],

        iconAnchor:
            [
                14,
                14
            ]

    });
}


// ============================================================
// DISTANCE ICON
// ============================================================

function distanceIcon(
    distance
) {


    return L.divIcon({

        className:
            "distance-marker",

        html:

            "<div class='distance-label'>"
            +
            Number(
                distance
            ).toFixed(1)
            +
            " km</div>",

        iconSize:
            [
                1,
                1
            ],

        iconAnchor:
            [
                0,
                0
            ]

    });
}


// ============================================================
// POINTS
// ============================================================

const pointLayers = [];


DATA.forEach(
    p => {


        const marker =
            L.marker(

                [
                    p.lat,
                    p.lon
                ],

                {
                    icon:
                        pointIcon(
                            p
                        )
                }

            );


        marker.bindTooltip(
            p.town,
            {
                direction:
                    "top"
            }
        );


        marker.bindPopup(
            buildPopup(p),
            {
                maxWidth:
                    420
            }
        );


        marker.addTo(
            map
        );


        pointLayers.push(
            {
                data: p,
                marker: marker
            }
        );

    }
);


// ============================================================
// NETWORK
// ============================================================

const connectionLayers =
    [];


CONNECTIONS.forEach(
    con => {


        const source =
            DATA[
                con.source
            ];


        const target =
            DATA[
                con.target
            ];


        if (
            !source
            ||
            !target
        ) {

            return;
        }


        const midpoint = [

            (
                source.lat
                +
                target.lat
            ) / 2,

            (
                source.lon
                +
                target.lon
            ) / 2

        ];


        const sourceColour =
            TEHSIL_COLORS[
                source.tehsil
            ]
            ||
            "#667085";


        const targetColour =
            TEHSIL_COLORS[
                target.tehsil
            ]
            ||
            "#667085";


        const segments =
            [];


        const tooltip =
            source.town
            +
            " ↔ "
            +
            target.town
            +
            " | "
            +
            con.distance.toFixed(1)
            +
            " km";


        // SAME TEHSIL

        if (
            source.tehsil
            ===
            target.tehsil
        ) {


            const line =
                L.polyline(

                    [

                        [
                            source.lat,
                            source.lon
                        ],

                        [
                            target.lat,
                            target.lon
                        ]

                    ],

                    {

                        color:
                            sourceColour,

                        weight:
                            4,

                        opacity:
                            .78

                    }

                );


            line.bindTooltip(
                tooltip
            );


            line.addTo(
                map
            );


            segments.push(
                line
            );

        }


        // CROSS TEHSIL

        else {


            const first =
                L.polyline(

                    [

                        [
                            source.lat,
                            source.lon
                        ],

                        midpoint

                    ],

                    {

                        color:
                            sourceColour,

                        weight:
                            4,

                        opacity:
                            .78

                    }

                );


            const second =
                L.polyline(

                    [

                        midpoint,

                        [
                            target.lat,
                            target.lon
                        ]

                    ],

                    {

                        color:
                            targetColour,

                        weight:
                            4,

                        opacity:
                            .78

                    }

                );


            first.bindTooltip(
                tooltip
            );


            second.bindTooltip(
                tooltip
            );


            first.addTo(
                map
            );


            second.addTo(
                map
            );


            segments.push(
                first,
                second
            );

        }


        const label =
            L.marker(

                midpoint,

                {
                    icon:
                        distanceIcon(
                            con.distance
                        ),

                    interactive:
                        false
                }

            );


        label.addTo(
            map
        );


        connectionLayers.push({

            source:
                con.source,

            target:
                con.target,

            segments:
                segments,

            label:
                label

        });

    }
);


// ============================================================
// FILTERS
// ============================================================

const showP1 =
    document.getElementById(
        "showP1"
    );


const showP2 =
    document.getElementById(
        "showP2"
    );


const showOther =
    document.getElementById(
        "showOther"
    );


const showDistances =
    document.getElementById(
        "showDistances"
    );


function typeAllowed(p) {


    const type =
        String(
            p.villageType
            ||
            ""
        ).toUpperCase();


    if (
        type === "P1"
    ) {

        return showP1.checked;
    }


    if (
        type === "P2"
    ) {

        return showP2.checked;
    }


    return showOther.checked;
}


// ============================================================
// APPLY FILTERS
// ============================================================

function applyFilters() {


    const selected =
        tehsilFilter.value;


    const contextIds =
        new Set();


    let visibleLines =
        0;


    connectionLayers.forEach(
        c => {


            const source =
                DATA[
                    c.source
                ];


            const target =
                DATA[
                    c.target
                ];


            const typeOK =
                typeAllowed(
                    source
                )
                &&
                typeAllowed(
                    target
                );


            const tehsilOK =
                selected === "ALL"
                ||
                source.tehsil === selected
                ||
                target.tehsil === selected;


            const show =
                typeOK
                &&
                tehsilOK;


            c.segments.forEach(
                line => {


                    if (show) {


                        if (
                            !map.hasLayer(
                                line
                            )
                        ) {

                            line.addTo(
                                map
                            );
                        }

                    }

                    else {


                        if (
                            map.hasLayer(
                                line
                            )
                        ) {

                            map.removeLayer(
                                line
                            );
                        }

                    }

                }
            );


            if (
                show
                &&
                showDistances.checked
            ) {


                if (
                    !map.hasLayer(
                        c.label
                    )
                ) {

                    c.label.addTo(
                        map
                    );
                }

            }

            else {


                if (
                    map.hasLayer(
                        c.label
                    )
                ) {

                    map.removeLayer(
                        c.label
                    );
                }

            }


            if (show) {

                visibleLines++;

                contextIds.add(
                    source.id
                );

                contextIds.add(
                    target.id
                );
            }

        }
    );


    let visibleLocations =
        0;


    pointLayers.forEach(
        obj => {


            const p =
                obj.data;


            const typeOK =
                typeAllowed(p);


            let tehsilOK =
                selected === "ALL"
                ||
                p.tehsil === selected;


            // retain cross-Tehsil endpoint
            if (
                selected !== "ALL"
                &&
                contextIds.has(
                    p.id
                )
            ) {

                tehsilOK =
                    true;
            }


            const show =
                typeOK
                &&
                tehsilOK;


            if (show) {


                if (
                    !map.hasLayer(
                        obj.marker
                    )
                ) {

                    obj.marker.addTo(
                        map
                    );
                }


                visibleLocations++;

            }

            else {


                if (
                    map.hasLayer(
                        obj.marker
                    )
                ) {

                    map.removeLayer(
                        obj.marker
                    );
                }

            }

        }
    );


    document.getElementById(
        "visibleLocations"
    ).textContent =
        visibleLocations.toLocaleString();


    document.getElementById(
        "visibleLines"
    ).textContent =
        visibleLines.toLocaleString();

}


// ============================================================
// FILTER EVENTS
// ============================================================

[

    showP1,
    showP2,

    showDistances

        control.addEventListener(

// ============================================================
// NEAREST 5 FROM CURRENT LOCATION
// ============================================================

function nearestFromCurrentLocation(
    lat,
    lon
) {


    return DATA

        .map(
            p => {


                return {

                    point:
                        p,

                    distance:
                        haversineKm(

                            lat,
                            lon,

                            p.lat,
                            p.lon

                        )

                };

            }
        )

        .filter(
            x =>
                x.distance
                <=
                CURRENT_LOCATION_MAX_KM
        )

        .sort(
            (a,b) =>
                a.distance
                -
                b.distance
        )

        .slice(
            0,
            CURRENT_NEAREST_COUNT
        );

}


// ============================================================
// RESULT CARD
// ============================================================

function createResultCard(
    item,
    rank
) {


    const p =
        item.point;


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "nearest-card";


    card.innerHTML =

        "<div class='nearest-rank'>"
        +
        rank
        +
        "</div>"

        +

        "<div>"

        +
        "<div class='nearest-name'>"
        +
        escapeHtml(
            p.town
        )
        +
        "</div>"

        +

        "<div class='nearest-meta'>"
        +
        escapeHtml(
            p.villageType
            ||
            "Other"
        )
        +
        " · "
        +
        escapeHtml(
            p.tehsil
        )
        +
        "</div>"

        +

        "</div>"

        +

        "<div class='nearest-distance'>"
        +
        item.distance.toFixed(1)
        +
        " km"
        +
        "</div>";


    card.addEventListener(
        "click",
        () => {


            map.setView(

                [
                    p.lat,
                    p.lon
                ],

                Math.max(
                    map.getZoom(),
                    12
                )

            );


            // close mobile drawer
            sidebar.classList.remove(
                "open"
            );


            const original =
                pointLayers.find(
                    obj =>
                        obj.data.id
                        ===
                        p.id
                );


            if (original) {

                original.marker.openPopup();
            }

        }
    );


    return card;
}


// ============================================================
// ADD CURRENT LOCATION LINE
// ============================================================

function addNearestLine(
    userLat,
    userLon,
    item,
    rank
) {


    const p =
        item.point;


    const line =
        L.polyline(

            [

                [
                    userLat,
                    userLon
                ],

                [
                    p.lat,
                    p.lon
                ]

            ],

            {

                color:
                    "#111827",

                weight:
                    rank === 1
                    ?
                    5
                    :
                    3,

                opacity:
                    .85,

                dashArray:
                    "8,7"

            }

        );


    line.bindTooltip(

        "#"
        +
        rank
        +
        " "
        +
        p.town
        +
        " · "
        +
        item.distance.toFixed(1)
        +
        " km"

    );


    line.addTo(
        currentLocationGroup
    );


    const mid = [

        (
            userLat
            +
            p.lat
        ) / 2,

        (
            userLon
            +
            p.lon
        ) / 2

    ];


    L.marker(

        mid,

        {
            icon:
                distanceIcon(
                    item.distance
                ),

            interactive:
                false
        }

    ).addTo(
        currentLocationGroup
    );


    const highlightIcon =
        L.divIcon({

            className:
                "location-marker",

            html:

                "<div class='nearest-highlight'>"
                +
                rank
                +
                "</div>",

            iconSize:
                [
                    34,
                    34
                ],

            iconAnchor:
                [
                    17,
                    17
                ]

        });


    L.marker(

        [
            p.lat,
            p.lon
        ],

        {
            icon:
                highlightIcon
        }

    )
    .bindPopup(
        buildPopup(p),
        {
            maxWidth:
                420
        }
    )
    .addTo(
        currentLocationGroup
    );

}


// ============================================================
// FIND CURRENT LOCATION
// ============================================================

document.getElementById(
    "locationButton"
).addEventListener(
    "click",
    () => {


        currentLocationGroup.clearLayers();


        locationResults.innerHTML =
            "";


        if (
            !navigator.geolocation
        ) {


            locationStatus.textContent =
                "Geolocation is not supported by this browser.";


            return;
        }


        locationStatus.textContent =
            "Getting your current location...";


        navigator.geolocation.getCurrentPosition(


            // SUCCESS
            position => {


                const userLat =
                    position.coords.latitude;


                const userLon =
                    position.coords.longitude;


                // USER LOCATION

                L.marker(

                    [
                        userLat,
                        userLon
                    ],

                    {
                        icon:
                            currentLocationIcon()
                    }

                )
                .bindPopup(
                    "<strong>Your Current Location</strong>"
                )
                .addTo(
                    currentLocationGroup
                );


                // NEAREST 5

                const nearest =
                    nearestFromCurrentLocation(

                        userLat,
                        userLon

                    );


                if (
                    nearest.length === 0
                ) {


                    locationStatus.textContent =
                        "No mapped location found within 50 km.";


                    map.setView(
                        [
                            userLat,
                            userLon
                        ],
                        11
                    );


                    return;
                }


                locationStatus.innerHTML =

                    "Showing <strong>"
                    +
                    nearest.length
                    +
                    "</strong> nearest points within "
                    +
                    CURRENT_LOCATION_MAX_KM
                    +
                    " km.";


                const fitPoints = [

                    [
                        userLat,
                        userLon
                    ]

                ];


                nearest.forEach(
                    (
                        item,
                        index
                    ) => {


                        const rank =
                            index + 1;


                        locationResults.appendChild(

                            createResultCard(
                                item,
                                rank
                            )

                        );


                        addNearestLine(

                            userLat,
                            userLon,

                            item,
                            rank

                        );


                        fitPoints.push(

                            [
                                item.point.lat,
                                item.point.lon
                            ]

                        );

                    }
                );


                map.fitBounds(

                    L.latLngBounds(
                        fitPoints
                    ),

                    {
                        padding:
                            [
                                50,
                                50
                            ],

                        maxZoom:
                            13
                    }

                );

            },


            // ERROR
            error => {


                let msg =
                    "Unable to get current location.";


                if (
                    error.code === 1
                ) {

                    msg =
                        "Location permission denied. Please allow location access.";
                }


                else if (
                    error.code === 2
                ) {

                    msg =
                        "Your current location could not be determined.";
                }


                else if (
                    error.code === 3
                ) {

                    msg =
                        "Location request timed out.";
                }


                locationStatus.textContent =
                    msg;

            },


            {
                enableHighAccuracy:
                    true,

                timeout:
                    15000,

                maximumAge:
                    30000
            }

        );

    }
);


// ============================================================
// CLEAR LOCATION
// ============================================================

document.getElementById(
    "clearLocation"
).addEventListener(
    "click",
    () => {


        currentLocationGroup.clearLayers();


        locationResults.innerHTML =
            "";


        locationStatus.textContent =
            "Finds the nearest 5 mapped points within 50 km.";

    }
);


// ============================================================
// INITIAL FILTER
// ============================================================

applyFilters();


// ============================================================
// HANDLE RESIZE
// ============================================================

window.addEventListener(
    "resize",
    () => {

        map.invalidateSize();
    }
);


</script>

</body>

</html>
